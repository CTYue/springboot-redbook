# datasource
spring.datasource.url=jdbc:mysql://192.168.5.13:3306/redbook?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=chuwa
spring.datasource.password=chuwa
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# hibernate properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect

# hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

#server.error.include-message=always
#server.error.include-stacktrace=always


# Actuator configuration
# Expose all actuator endpoints including prometheus
management.endpoints.web.exposure.include=*

# Show detailed health information
management.endpoint.health.show-details=always

# Enable beans endpoint
management.endpoint.beans.enabled=true

# Enable metrics endpoint
management.endpoint.metrics.enabled=true

# Enable specific metrics
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true
management.metrics.enable.http=true
management.metrics.enable.logback=true
management.metrics.enable.tomcat=true
management.endpoint.threaddump.enabled=true

# HTTP request metrics configuration
management.metrics.distribution.percentiles-histogram.http.server.requests=true

# Optional: Add application info for metrics
management.metrics.tags.application=${spring.application.name:redbook}


logging.level.root: info
logging.level.com.chuwa.redbook.*: trace