# datasource
# please update following db connection otherwise your integration test fails.
spring.datasource.url=jdbc:mysql://192.168.5.13:3306/redbook?allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=chuwa
spring.datasource.password=chuwa

# hibernate properties
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQL5InnoDBDialect

# hibernate ddl auto (create, create-drop, validate, update)
spring.jpa.hibernate.ddl-auto=update

# Spring Actuator configurations
# Expose all actuator endpoints over HTTP
management.endpoints.web.exposure.include=*
# Alternative: Expose specific endpoints only
# management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,beans,loggers

# Enable all actuator endpoints
management.endpoints.enabled-by-default=true

# Show detailed health information
management.endpoint.health.show-details=always

# Base path for actuator endpoints (default is /actuator)
management.endpoints.web.base-path=/actuator

# Show components in health endpoint
management.endpoint.health.show-components=always

# Enable specific endpoints individually (if needed)
management.endpoint.info.enabled=true
management.endpoint.metrics.enabled=true
management.endpoint.env.enabled=true
management.endpoint.loggers.enabled=true
management.endpoint.threaddump.enabled=true
management.endpoint.heapdump.enabled=true

# Logging configuration
# Set root logging level to TRACE
logging.level.root=TRACE
